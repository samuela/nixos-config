config_version = 12

[bar.main]
start = [ "control-center", "cpu" ]
widget_spacing = 12

[battery.device."/org/freedesktop/UPower/devices/headset_dev_B8_7B_D4_19_1B_15"]
warning_threshold = 15

[dock]
reserve_space = false
smart_auto_hide = true

[location]
auto_locate = true

[lockscreen_widgets]
enabled = false
schema_version = 2
widget_order = [ "lockscreen-login-box@DP-3", "lockscreen-login-box@eDP-1" ]

    [lockscreen_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [lockscreen_widgets.widget."lockscreen-login-box@DP-3"]
    box_height = 196.0
    box_width = 810.0
    cx = 1280.0
    cy = 1258.0
    output = "DP-3"
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@DP-3".settings]
        background_color = "surface_variant"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = true
        show_session_buttons = true
        show_unlock_hint = true
        show_weather = true

    [lockscreen_widgets.widget."lockscreen-login-box@eDP-1"]
    box_height = 196.0
    box_width = 810.0
    cx = 720.0
    cy = 778.0
    output = "eDP-1"
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@eDP-1".settings]
        background_color = "surface_variant"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = true
        show_session_buttons = true
        show_unlock_hint = true
        show_weather = true

[shell]
telemetry_enabled = true

    [shell.panel]
    open_near_click_control_center = true

[theme]
builtin = "Nord"

[wallpaper]
enabled = true

    [wallpaper.default]
    path = "/home/skainswo/Pictures/Wallpapers/john-towner-JgOeRuGD_Y4-unsplash.jpg"

    [wallpaper.last]
    path = "/home/skainswo/Pictures/Wallpapers/john-towner-JgOeRuGD_Y4-unsplash.jpg"

    [wallpaper.monitors.eDP-1]
    path = "/home/skainswo/Pictures/Wallpapers/john-towner-JgOeRuGD_Y4-unsplash.jpg"

[widget.battery]
show_label = false

[widget.brightness]
show_label = false

[widget.cpu]
show_value = false

[widget.network]
show_label = false

[widget.volume]
show_label = false
